<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>Neon Harbor — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1426; font-family: system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 5; }
  #hud button { pointer-events: auto; cursor: pointer; }
  #hud-top-left { position: absolute; top: 14px; left: 14px; text-shadow: 0 1px 3px #000; }
  #health-wrap { width: 190px; height: 16px; background: rgba(0,0,0,.55); border: 1px solid #fff3; border-radius: 8px; overflow: hidden; position: relative; }
  #health-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #37d67a, #9be15d); transition: width .2s; }
  #health-text { position: absolute; right: 6px; top: 0; font-size: 11px; line-height: 16px; }
  #money-line { margin-top: 6px; font-size: 17px; font-weight: 700; }
  #objective-line { margin-top: 6px; font-size: 14px; max-width: 420px; color: #bff5e4; }
  #hud-top-right { position: absolute; top: 14px; right: 14px; text-align: right; text-shadow: 0 1px 3px #000; }
  #stars { font-size: 24px; letter-spacing: 2px; }
  #clock-line, #speed-line { font-size: 15px; font-weight: 600; }
  #minimap { margin-top: 8px; border: 2px solid #ffffff44; border-radius: 6px; background: #10131c; }
  #banner { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 800; padding: 12px 26px; border-radius: 10px; text-shadow: 0 2px 4px #000; }
  #banner.good { background: rgba(20, 120, 70, .85); }
  #banner.bad { background: rgba(160, 30, 30, .85); }
  #briefing { position: absolute; bottom: 18%; left: 50%; transform: translateX(-50%); width: min(560px, 90vw); background: rgba(10, 10, 24, .88); border: 1px solid #ffffff33; border-radius: 12px; padding: 16px 20px; text-align: center; }
  #briefing-text { font-size: 15px; line-height: 1.5; margin-bottom: 12px; }
  #title-screen, #pause-screen, #shop-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(12, 8, 26, .82); text-align: center; pointer-events: auto; }
  #title-screen h1 { font-size: 56px; margin: 0; letter-spacing: 6px; color: #ff5ce1; text-shadow: 0 0 24px #ff5ce1aa, 0 2px 0 #000; }
  #title-screen .tagline { font-size: 17px; color: #ffd23e; margin: 8px 0 4px; }
  #title-screen .story { max-width: 520px; font-size: 15px; line-height: 1.55; color: #ddd; }
  #title-screen .controls-list { font-size: 13px; color: #aaa; line-height: 1.7; margin: 10px 0 18px; }
  #title-screen button, #pause-screen button, #shop-screen button, #briefing button { font-size: 17px; padding: 10px 26px; margin: 4px; border-radius: 8px; border: 1px solid #ffffff55; background: #2c2145; color: #fff; }
  #title-screen button:hover, #pause-screen button:hover, #shop-screen button:hover, #briefing button:hover { background: #46336e; }
  #pause-screen h2, #shop-screen h2 { font-size: 34px; margin: 0 0 12px; letter-spacing: 3px; }
  #shop-screen { justify-content: flex-start; padding-top: 12vh; }
  .shop-note { color: #bbb; font-size: 13px; margin: 0 0 14px; }
  .shop-row { display: flex; gap: 12px; align-items: center; background: rgba(255,255,255,.07); border: 1px solid #ffffff22; border-radius: 8px; padding: 10px 14px; margin: 6px 0; width: min(560px, 88vw); text-align: left; }
  .shop-name { font-weight: 700; min-width: 150px; }
  .shop-desc { flex: 1; font-size: 13px; color: #ccc; }
  .shop-row button { font-size: 14px; padding: 6px 14px; }
  #shop-msg { margin: 10px 0; min-height: 20px; color: #ffd23e; }
  #touch-ui { position: absolute; inset: 0; pointer-events: none; }
  #joystick { position: absolute; left: 22px; bottom: 26px; width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid #ffffff44; pointer-events: auto; }
  #joy-knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(255,255,255,.35); }
  #touch-buttons { position: absolute; right: 22px; bottom: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; pointer-events: auto; }
  #touch-buttons button { width: 64px; height: 64px; border-radius: 50%; font-size: 13px; font-weight: 700; background: rgba(255,255,255,.16); border: 2px solid #ffffff55; color: #fff; }
  .hidden { display: none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Neon Harbor: drive, steal cars, outrun the harbor police and run Ms. Vane's jobs"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
